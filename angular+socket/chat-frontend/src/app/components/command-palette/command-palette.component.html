@if (isOpen()) {
  <div class="cmdk-scrim" (click)="close()">
    <div
      class="cmdk glass"
      role="dialog"
      aria-modal="true"
      aria-label="Command palette"
      (click)="$event.stopPropagation()"
      (keydown)="onPaletteKeydown($event)"
    >
      <div class="cmdk-search">
        <svg class="cmdk-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" /><line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input
          #cmdkInput
          class="cmdk-input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search actions and pages…"
          [value]="query()"
          (input)="onQueryInput(cmdkInput.value)"
          aria-label="Search commands"
        />
        <span class="kbd">Esc</span>
      </div>

      <div class="cmdk-list" role="listbox">
        @if (results().length === 0) {
          <div class="cmdk-empty">
            <span>No results for “{{ query() }}”</span>
          </div>
        } @else {
          @for (cmd of results(); track trackById($index, cmd); let i = $index) {
            <button
              type="button"
              class="cmdk-item"
              role="option"
              [class.is-active]="i === activeIndex()"
              [attr.aria-selected]="i === activeIndex()"
              (mouseenter)="activeIndex.set(i)"
              (click)="select(cmd)"
            >
              <span class="cmdk-item-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 12h14" /><path d="M13 6l6 6-6 6" />
                </svg>
              </span>
              <span class="cmdk-item-label">{{ cmd.label }}</span>
              <span class="cmdk-item-hint">{{ cmd.hint }}</span>
              <span class="badge badge-accent cmdk-item-group">{{ cmd.group }}</span>
            </button>
          }
        }
      </div>

      <div class="cmdk-footer">
        <span><span class="kbd">↑</span><span class="kbd">↓</span> navigate</span>
        <span><span class="kbd">↵</span> select</span>
        <span><span class="kbd">Esc</span> close</span>
      </div>
    </div>
  </div>
}

<!doctype html>
<html lang="en" data-theme="dark" data-palette="regular">
<head>
  <meta charset="utf-8">
  <title>Clarity</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/assets/clarity-logo.jpg">
  <script>
    // No-flash boot: apply the persisted theme + palette before first paint.
    // SSR-safe (guarded) and never throws if storage is blocked.
    (function () {
      try {
        var t = localStorage.getItem('clarity-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
        var p = localStorage.getItem('clarity-palette');
        if (p === 'regular' || p === 'clarity') {
          document.documentElement.setAttribute('data-palette', p);
        }
      } catch (e) { /* storage unavailable — keep defaults dark + regular */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>

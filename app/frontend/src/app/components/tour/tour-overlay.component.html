@if (tour.active()) {
  <div class="tour-root" role="dialog" aria-modal="true" aria-label="Product tour">

    <!-- Dimmed scrim with a spotlight cutout around the current target. -->
    @if (spotlight(); as s) {
      <div class="tour-scrim tour-scrim-cut"
           [style.--cut-top.px]="s.top"
           [style.--cut-left.px]="s.left"
           [style.--cut-w.px]="s.width"
           [style.--cut-h.px]="s.height"
           (click)="skip()"
           aria-hidden="true"></div>

      <!-- Glowing ring around the highlighted element. -->
      <div class="tour-ring"
           [style.top.px]="s.top"
           [style.left.px]="s.left"
           [style.width.px]="s.width"
           [style.height.px]="s.height"
           aria-hidden="true"></div>
    } @else {
      <!-- No measurable target: plain scrim, centered tooltip. -->
      <div class="tour-scrim" (click)="skip()" aria-hidden="true"></div>
    }

    <!-- Glass tooltip -->
    @if (tour.currentStep(); as step) {
      <div class="tour-tip glass" [style]="tooltipStyle()">
        <div class="tour-tip-head">
          <span class="tour-step-count">
            Step {{ tour.stepIndex() + 1 }} of {{ tour.stepCount() }}
          </span>
          <button class="tour-close btn-icon" (click)="skip()" aria-label="Skip tour">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true" focusable="false">
              <line x1="5" y1="5" x2="15" y2="15"/><line x1="15" y1="5" x2="5" y2="15"/>
            </svg>
          </button>
        </div>

        <h3 class="tour-tip-title display">{{ step.title }}</h3>
        <p class="tour-tip-body">{{ step.body }}</p>

        <div class="tour-tip-foot">
          <div class="tour-dots" aria-hidden="true">
            @for (d of dots(); track d) {
              <span class="tour-dot" [class.is-active]="d === tour.stepIndex()"></span>
            }
          </div>

          <div class="tour-actions">
            <button class="btn btn-ghost btn-sm" (click)="skip()">Skip</button>
            @if (tour.stepIndex() > 0) {
              <button class="btn btn-secondary btn-sm" (click)="prev()">Back</button>
            }
            <button class="btn btn-primary btn-sm" (click)="next()">
              {{ tour.isLast() ? 'Done' : 'Next' }}
            </button>
          </div>
        </div>
      </div>
    }
  </div>
}
